<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyro & WASD Physics Rolling Game</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: sans-serif; }
        #start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 24px; cursor: pointer;
            background-color: #ff4444; color: white; border: none; border-radius: 8px;
            z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #ui-layer {
            position: absolute; top: 10px; left: 10px; color: white;
            font-size: 24px; pointer-events: none; text-shadow: 2px 2px 4px black;
            font-weight: bold; z-index: 6;
        }
        #calibration-ui {
            position: absolute; top: 50px; left: 10px; color: white;
            font-size: 13px; background: rgba(0,0,0,0.75); padding: 10px; border-radius: 5px;
            z-index: 5; max-height: 85vh; overflow-y: auto; width: 170px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #calibration-ui input { cursor: pointer; width: 140px; margin-bottom: 5px; }
        .slider-group { margin-bottom: 12px; border-bottom: 1px solid #555; padding-bottom: 5px; }
        .slider-group b { display:block; margin-bottom:4px; color: #ffdd44; }
        .slider-row { display:flex; justify-content: space-between; }
    </style>
</head>
<body>
    <button id="start-btn">タップしてスタート<br>(PCはそのままWASD操作可)</button>
    <div id="ui-layer">Score: <span id="score">0</span></div>

    <div id="calibration-ui">
        <div class="slider-group">
            <b>図形パラメータ</b>
            <div class="slider-row">摩擦μ<span id="valFriction">0</span></div><input type="range" id="friction" min="0" max="1" step="0.01" value="0">
            <div class="slider-row">落下高さ<span id="valDropHeight">15</span></div><input type="range" id="dropHeight" min="5" max="60" value="15">
            <div class="slider-row">落下間隔(秒)<span id="valSpawnInterval">4</span></div><input type="range" id="spawnInterval" min="1" max="30" value="4">
            <div class="slider-row">サイズ<span id="valShapeSize">1.2</span></div><input type="range" id="shapeSize" min="0.3" max="3" step="0.1" value="1.2">
        </div>
        <div class="slider-group">
            <b>奥の円柱 (土管)</b>
            <div class="slider-row">X<span id="valPipeX">0</span></div><input type="range" id="pipeX" min="-25" max="25" value="0">
            <div class="slider-row">Y<span id="valPipeY">15</span></div><input type="range" id="pipeY" min="5" max="30" value="15">
            <div class="slider-row">Z<span id="valPipeZ">-10</span></div><input type="range" id="pipeZ" min="-25" max="25" value="-10">
            <div class="slider-row">傾きX<span id="valPipeRotX">0</span>°</div><input type="range" id="pipeRotX" min="-90" max="90" value="0">
            <div class="slider-row">傾きZ<span id="valPipeRotZ">0</span>°</div><input type="range" id="pipeRotZ" min="-90" max="90" value="0">
            <div class="slider-row">太さ<span id="valPipeRadius">2</span></div><input type="range" id="pipeRadius" min="0.5" max="5" step="0.1" value="2">
            <div class="slider-row">長さ<span id="valPipeHeight">20</span></div><input type="range" id="pipeHeight" min="5" max="40" value="20">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module">
        import * as CANNON from 'https://cdn.skypack.dev/cannon-es';

        // === 状態・設定変数 ===
        let scene, camera, renderer, world;
        let boardBody, boardMesh, pipeMesh;
        const shapes = [];
        let score = 0;
        const clock = new THREE.Clock();

        let gyroTiltX = 0, gyroTiltZ = 0;
        let keyTiltX = 0, keyTiltZ = 0;
        let currentTiltX = 0, currentTiltZ = 0;

        let rawBetaDeg = 0, rawGammaDeg = 0;   // ジャイロの最新生値(度)
        let gyroOffsetX = 0, gyroOffsetZ = 0;  // スタート時に取得した0点オフセット(度)

        const TILT_LIMIT = 55 * (Math.PI / 180);
        const BASKET_Y = -24;
        const BASKET_Z_SCALE = 1.3; // 籠のZ方向サイズ倍率

        let shapeFriction = 0;
        let dropHeight = 15;
        let spawnInterval = 4000;
        let shapeSize = 1.2;
        let spawnTimer = null;

        const basketBlue = { x: -22, z: 0, size: 15, group: null };
        const basketOrange = { x: 22, z: 0, size: 15, group: null };
        const pipeParam = { x: 0, y: 15, z: -10, rotX: 0, rotY: 0, rotZ: 0, radius: 2, height: 20 };

        // === 初期化 ===
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 35, 45);
            camera.lookAt(0, -5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 40, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.set(1024, 1024);
            scene.add(dirLight);

            world = new CANNON.World({ gravity: new CANNON.Vec3(0, -27, 0) });
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;
            world.allowSleep = true;

            // 円盤の作成 (Three.jsとCannon-esでY軸方向が一致するように修正)
            const boardRad = 15, boardHeight = 1;
            boardMesh = new THREE.Mesh(
                new THREE.CylinderGeometry(boardRad, boardRad, boardHeight, 24),
                new THREE.MeshStandardMaterial({ color: 0x3388ff, roughness: 0.8 })
            );
            boardMesh.receiveShadow = true;
            scene.add(boardMesh);

            boardBody = new CANNON.Body({
                mass: 0, 
                type: CANNON.Body.KINEMATIC, 
                shape: new CANNON.Cylinder(boardRad, boardRad, boardHeight, 16)
            });
            boardBody.material = new CANNON.Material('boardMaterial');
            world.addBody(boardBody);

            createBasket(basketBlue, 0x00aaff);
            createBasket(basketOrange, 0xffaa00);
            createOrUpdatePipe();

            startSpawnLoop();
            spawnShape();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            animate();
        }

        // === オブジェクト生成 ===
        function createBasket(basket, color) {
            if (basket.group) scene.remove(basket.group);
            basket.group = new THREE.Group();
            
            const size = basket.size, sizeZ = basket.size * BASKET_Z_SCALE, thick = 1.0;
            const mat = new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.6, side: THREE.DoubleSide });

            const walls = [
                { s: [size, size, thick], p: [0, size/2, sizeZ/2] }, 
                { s: [size, size, thick], p: [0, size/2, -sizeZ/2] },
                { s: [thick, size, sizeZ], p: [size/2, size/2, 0] }, 
                { s: [thick, size, sizeZ], p: [-size/2, size/2, 0] },
                { s: [size, thick, sizeZ], p: [0, thick/2, 0] }          
            ];

            walls.forEach(({s, p}) => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(...s), mat);
                mesh.position.set(...p);
                mesh.castShadow = true; mesh.receiveShadow = true;
                basket.group.add(mesh);

                const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(s[0]/2, s[1]/2, s[2]/2)) });
                body.position.set(basket.x + p[0], BASKET_Y + p[1], basket.z + p[2]);
                world.addBody(body);
            });
            basket.group.position.set(basket.x, BASKET_Y, basket.z);
            scene.add(basket.group);
        }

        function createOrUpdatePipe() {
            if (pipeMesh) scene.remove(pipeMesh);
            pipeMesh = new THREE.Mesh(
                new THREE.CylinderGeometry(pipeParam.radius, pipeParam.radius, pipeParam.height, 16, 1, true),
                new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.4, metalness: 0.2, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
            );
            pipeMesh.position.set(pipeParam.x, pipeParam.y, pipeParam.z);
            pipeMesh.rotation.set(pipeParam.rotX, pipeParam.rotY, pipeParam.rotZ);
            scene.add(pipeMesh);
        }

        function spawnShape() {
            const type = Math.floor(Math.random() * 3);
            const size = shapeSize;
            let geo, shape;

            if (type === 0) {
                geo = new THREE.SphereGeometry(size, 12, 12);
                shape = new CANNON.Sphere(size);
            } else if (type === 1) {
                geo = new THREE.CylinderGeometry(size, size, size * 2, 12);
                shape = new CANNON.Cylinder(size, size, size * 2, 12);
            } else {
                geo = new THREE.ConeGeometry(size, size * 2, 12);
                shape = new CANNON.Cylinder(0.01, size, size * 2, 12);
            }

            const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(Math.random(), 1, 0.5), roughness: 0.2 }));
            mesh.castShadow = true; mesh.receiveShadow = true;
            scene.add(mesh);

            const matPhys = new CANNON.Material();
            matPhys.friction = (type > 0) ? shapeFriction * 0.5 : shapeFriction;
            
            const body = new CANNON.Body({ mass: 1, shape: shape, material: matPhys, allowSleep: true, sleepSpeedLimit: 0.5, sleepTimeLimit: 1.0 });
            
            if (boardBody.material) {
                world.addContactMaterial(new CANNON.ContactMaterial(boardBody.material, matPhys, { friction: matPhys.friction, restitution: 0.1 }));
            }

            const spawnPos = new THREE.Vector3(0, pipeParam.height / 2, 0);
            if (pipeMesh) pipeMesh.localToWorld(spawnPos);
            else spawnPos.set(pipeParam.x, pipeParam.y + pipeParam.height / 2, pipeParam.z);

            body.position.copy(spawnPos);
            world.addBody(body);
            shapes.push({ mesh, body, scored: false });
        }

        function startSpawnLoop() {
            if (spawnTimer) clearInterval(spawnTimer);
            spawnTimer = setInterval(spawnShape, spawnInterval);
        }

        // === 判定処理 (籠のZサイズはBASKET_Z_SCALE倍) ===
        const isOverBasket = (pos, basket) => Math.abs(pos.x - basket.x) < basket.size/2 + 4 && Math.abs(pos.z - basket.z) < (basket.size * BASKET_Z_SCALE)/2 + 4;
        const checkScore = (pos, basket) => pos.y < BASKET_Y + basket.size && pos.y > BASKET_Y && Math.abs(pos.x - basket.x) < basket.size/2 && Math.abs(pos.z - basket.z) < (basket.size * BASKET_Z_SCALE)/2;

        // === メインループ ===
        function animate() {
            requestAnimationFrame(animate);
            world.step(1 / 60, clock.getDelta(), 3);

            // スムーズな傾き適用
            const targetX = Math.max(-TILT_LIMIT, Math.min(TILT_LIMIT, gyroTiltX + keyTiltX));
            const targetZ = Math.max(-TILT_LIMIT, Math.min(TILT_LIMIT, gyroTiltZ + keyTiltZ));
            currentTiltX += (targetX - currentTiltX) * 0.1;
            currentTiltZ += (targetZ - currentTiltZ) * 0.1;

            if (boardBody) {
                // Three.jsとCannon-esの回転を完全に同期させる（すり抜けバグ修正の要）
                boardMesh.rotation.set(currentTiltX, 0, -currentTiltZ);
                boardBody.quaternion.copy(boardMesh.quaternion);
            }

            for (let i = shapes.length - 1; i >= 0; i--) {
                const s = shapes[i];
                s.mesh.position.copy(s.body.position);
                s.mesh.quaternion.copy(s.body.quaternion);

                const pos = s.body.position;
                
                // 画面外の削除処理
                if (pos.y < -2 && !isOverBasket(pos, basketBlue) && !isOverBasket(pos, basketOrange)) {
                    scene.remove(s.mesh);
                    world.removeBody(s.body);
                    shapes.splice(i, 1);
                    continue;
                }

                // スコア判定
                if (!s.scored && (checkScore(pos, basketBlue) || checkScore(pos, basketOrange))) {
                    score += 10;
                    document.getElementById('score').innerText = score;
                    s.scored = true;
                    s.mesh.castShadow = s.mesh.receiveShadow = false;
                    s.mesh.material = new THREE.MeshBasicMaterial({ color: s.mesh.material.color }); // 軽量化
                }
            }
            renderer.render(scene, camera);
        }

        // === UI & イベントバインディング ===
        const setupSlider = (id, callback) => {
            document.getElementById(id).addEventListener('input', e => {
                callback(parseFloat(e.target.value));
                document.getElementById('val' + id.charAt(0).toUpperCase() + id.slice(1)).innerText = e.target.value;
            });
        };

        setupSlider('friction', v => shapeFriction = v);
        setupSlider('dropHeight', v => dropHeight = v);
        setupSlider('shapeSize', v => shapeSize = v);
        setupSlider('spawnInterval', v => { spawnInterval = v * 1000; startSpawnLoop(); });

        ['x', 'y', 'z', 'radius', 'height'].forEach(key => 
            setupSlider('pipe' + key.charAt(0).toUpperCase() + key.slice(1), v => { pipeParam[key] = v; createOrUpdatePipe(); })
        );
        ['rotX', 'rotZ'].forEach(key => 
            setupSlider('pipe' + key.charAt(0).toUpperCase() + key.slice(1), v => { pipeParam[key] = v * (Math.PI / 180); createOrUpdatePipe(); })
        );

        document.getElementById('start-btn').addEventListener('click', async (e) => {
            // iOS等ではジャイロアクセスに許可が必要
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try { await DeviceOrientationEvent.requestPermission(); } catch (err) {}
            }
            // 現在の傾きを0点として記録
            gyroOffsetX = rawBetaDeg;
            gyroOffsetZ = rawGammaDeg;
            e.target.style.display = 'none';
            init();
        });
        
        // 操作入力
        window.addEventListener('deviceorientation', e => {
            rawBetaDeg = e.beta || 0;
            rawGammaDeg = e.gamma || 0;
            gyroTiltX = (rawBetaDeg - gyroOffsetX) * (Math.PI/180);
            gyroTiltZ = (rawGammaDeg - gyroOffsetZ) * (Math.PI/180);
        });
        window.addEventListener('keydown', e => { 
            const k = e.key.toLowerCase(); 
            if(k==='w') keyTiltX = -0.22; if(k==='s') keyTiltX = 0.22; 
            if(k==='a') keyTiltZ = -0.22; if(k==='d') keyTiltZ = 0.22; 
        });
        window.addEventListener('keyup', () => { keyTiltX = 0; keyTiltZ = 0; });
    </script>
</body>
</html>
